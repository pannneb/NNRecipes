<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:switch="${recipeImagesFromComments}" class="container padding10 my-2">
    
    <div class="col-md-12 col-lg-12" style="font-style: oblique;" th:case="null" >
	    <h2  style="text-align:center" th:text="#{label.images.list.noImagesYet}"></h2>
    </div>
    <div th:case="*">
		<div id="carouselExampleIndicators" class="carousel slide" data-ride="carousel">
		  
		  <ol class="carousel-indicators" >
		    <li th:each="img, imgStat:${recipeImagesFromComments}" data-target="#carouselExampleIndicators" th:attr="data-slide-to=${imgStat.index}" th:class="${imgStat.index}==0 ? 'active':''"></li>
		  </ol>

		  <div class="carousel-inner">
			    <div th:class="${imgStat.index}== 0  ? 'carousel-item active':'carousel-item'" th:each="img, imgStat:${recipeImagesFromComments}">
			      <img th:src="@{'/recipeImage/image/' + ${img.fileData.id}}" height="350" style="object-fit: contain;" class="d-block w-100" alt="..."/>
			    </div>
		  </div>
		  
		  <a class="carousel-control-prev" href="#carouselExampleIndicators" role="button" data-slide="prev" >
		    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
		    <span class="sr-only">Previous</span>
		  </a>
		  <a class="carousel-control-next" href="#carouselExampleIndicators" role="button" data-slide="next" >
		    <span class="carousel-control-next-icon" aria-hidden="true"></span>
		    <span class="sr-only">Next</span>
		  </a>
		</div>
     </div>
</div>
