<html>
<body>

  <form>

									   
    <th:block th:fragment="input (label, name, type, isReadOnly)"  th:with="classCustom=${classCustom} ?: '', readOnly=${readOnly} ?: '', setTooltip=${setTooltip} ?: ''">
      
      <div th:with="valid=${!#fields.hasErrors(name)}"  th:class="${'form-group' + (valid ? '' : ' has-error')}" class="">
        
		<div id="tool_tip" th:if="${isReadOnly!='true'}" >
			<div th:if="${#strings.length(setTooltip)}" class="help-tip myTooltip">
				<p th:text="(#{'label.'+${label}+'.tooltip'})"></p>
			</div>
	        <!--  <label class="col-sm-12 control-label" th:text="(#{'label.'+${label}})">Label</label> -->
	        <label class="control-label" th:text="(#{'label.'+${label}})">Label</label>
		</div>

        <div th:class="'col-sm-12' + ' ' + ${(classCustom=='' ? '' : classCustom)}" >

	        <div th:switch="${type}" >

				<span th:case="'text'" >
					<span th:if="${isReadOnly=='true'}" class="row col-sm-12 zeroMargin zeroPadding" >
					  <div class="col-sm-3 zeroPadding">
	                  	<label class="control-label align-middle labelPaddingTop" th:text="(#{'label.'+${label}})" >Label</label>
	                  </div>
					  <div class="col-sm-9 zeroPadding">
	                  	<input class="form-control" style="font-style: italic" type="text" th:field="*{__${name}__}" th:readonly="${isReadOnly=='true'}"/>
					  </div>
				    </span>
					<span th:if="${isReadOnly!='true'}" >
            		    <input class="form-control"  type="text" th:field="*{__${name}__}" />
				      <!-- <input th:case="'text'" class="form-control"  type="text" th:field="*{__${name}__}" />  -->
					</span>
				</span>

				<span th:case="'checkbox'" >
					<span th:if="${isReadOnly=='true'}" class="row col-sm-12 zeroMargin zeroPadding" >
					  <div class="col-sm-3 zeroPadding">
	                  	<label class="control-label align-middle labelPaddingTop" th:text="(#{'label.'+${label}})" >Label</label>
	                  </div>
					  <div class="col-sm-9 zeroPadding round">
	                  	<input class="" type="checkbox" th:id="${name}" th:name="${name}" th:checked="*{__${name}__}" th:disabled="${isReadOnly=='true'}"/>
            		    <label th:for="${name}"></label>
            		    <input type="hidden" th:field="*{__${name}__}">
					  </div>
				    </span>
					<div th:if="${isReadOnly!='true'}" class=" round ">
            		    <input class="" type="checkbox" th:id="${name}" th:name="${name}" th:checked="*{__${name}__}" />
            		    <label th:for="${name}"></label>
				    </div>
				</span>
				
<!-- 
				<div class="container">
				  <div class="round">
				    <input type="checkbox" checked id="checkbox111" />
				    <label for="checkbox111"></label>
				  </div>
				</div>
	 -->						





                <span th:case="'number'" >
					<span th:if="${isReadOnly=='true'}" class="row col-sm-12 zeroMargin zeroPadding" >
					  <div class="col-sm-12 zeroPadding">
	                  	<label class="control-label align-middle labelPaddingTop" th:text="(#{'label.'+${label}})" >Label</label>
	                  </div>
					  <div class="col-sm-12 zeroPadding">
	                  	<input class="form-control" style="font-style: italic" type="number" th:field="*{__${name}__}" th:readonly="${isReadOnly=='true'}"/>
					  </div>
				    </span>
					<span th:if="${isReadOnly!='true'}" >
            		    <input class="form-control"  type="number" th:field="*{__${name}__}" />
				    </span>
				</span>
                           
                <span th:case="'date'" >
                	<span th:if="${isReadOnly=='true'}" class="row col-sm-12 zeroMargin zeroPadding" >
						  <div class="col-sm-5 zeroPadding">
		                  	<label class="control-label align-middle labelPaddingTop" th:text="(#{'label.'+${label}})" >Label</label>
		                  </div>
						  <div class="col-sm-7 zeroPadding">
		                  	<input class="form-control" type="date" style="font-style: italic" th:field="*{__${name}__}" th:readonly="${isReadOnly=='true'}" />
						  </div>
				    </span>
					<span th:if="${isReadOnly!='true'}" >
            	          <input class="form-control" type="date" th:field="*{__${name}__}" th:readonly="${isReadOnly=='true'}" />
				    </span>
                </span>
                
                      
                <span th:case="'time'" >
                	<span th:if="${isReadOnly=='true'}" class="row col-sm-12 zeroMargin zeroPadding" >
						  <div class="col-sm-5 zeroPadding">
		                  	<label class="control-label align-middle labelPaddingTop" th:text="(#{'label.'+${label}})" >Label</label>
		                  </div>
						  <div class="col-sm-7 zeroPadding">
		                  	<input class="form-control" type="time" style="font-style: italic" th:field="*{__${name}__}" th:readonly="${isReadOnly=='true'}" />
						  </div>
				    </span>
					<span th:if="${isReadOnly!='true'}" >
            	          <input class="form-control" type="time" th:field="*{__${name}__}" th:readonly="${isReadOnly=='true'}"  />
				    </span>
                </span>

				<div th:case="'dateTime'" >
					<span th:if="${isReadOnly=='true'}" class="row col-sm-12 zeroMargin zeroPadding" >
					    <div class="col-sm-5 zeroPadding">
		                  	<label class="control-label align-middle labelPaddingTop" th:text="(#{'label.'+${label}})" >Label</label>
		                </div>
					    <div class=" col-sm-7 zeroPadding">
	                  		<input class="form-control" style="font-style: italic" type="text" th:readonly="${isReadOnly=='true'}" th:field="*{__${name}__}" th:disabled="${isReadOnly=='true'}" />
	                  		<input type="hidden" th:field="*{__${name}__}">
		                </div>
		            </span>
					<span th:if="${isReadOnly!='true'}" >
            	        <div class="input-group date" data-target-input="nearest">
		                    <input type="text"  th:field="*{__${name}__}" class="form-control datetimepicker-input" th:data-target="'#' + ${name}" />
		                    <div class="input-group-append" th:data-target="'#' + ${name}" data-toggle="datetimepicker">
		                        <div class="input-group-text"><i class="fa fa-calendar"></i></div>
		                    </div>
		                </div>
				    </span>
				</div>

				<input th:case="'dateOld'" class="form-control" type="text" th:field="*{__${name}__}"
                        placeholder="YYYY-MM-DD" title="Enter a date in this format: YYYY-MM-DD"
                        pattern="(?:19|20)[0-9]{2}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1[0-9]|2[0-9])|(?:(?!02)(?:0[1-9]|1[0-2])-(?:30))|(?:(?:0[13578]|1[02])-31))"/>

				<span th:case="'textarea'" >
					<span th:if="${isReadOnly=='true'}" class="row col-sm-12 zeroMargin zeroPadding" >
					  <div class="col-sm-12 zeroPadding">
	                  	<label class="control-label align-middle labelPaddingTop" th:text="(#{'label.'+${label}})" >Label</label>
	                  </div>
					  <div class="col-sm-12 zeroPadding">
	                  	<textarea style="font-style: italic" class="form-control"  th:field="*{__${name}__}" rows="9" th:readonly="${isReadOnly=='true'}"></textarea>
					  </div>
				    </span>
					<span th:if="${isReadOnly!='true'}" >
            		   <textarea class="form-control"  th:field="*{__${name}__}" rows="9"></textarea>
					</span>
				</span>









            </div>
          <span th:if="${valid}" 
            class="glyphicon glyphicon-ok form-control-feedback"
            aria-hidden="true"></span>
          <th:block th:if="${!valid}">
            <span class="glyphicon glyphicon-remove form-control-feedback" aria-hidden="true"></span>
            <span style="color: red" class="help-inline" th:errors="*{__${name}__}">Error</span>
          </th:block>
        </div>
      </div>
    </th:block>

  </form>
</body>
</html>
