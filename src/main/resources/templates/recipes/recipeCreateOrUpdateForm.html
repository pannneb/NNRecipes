<body>
      
    <div id="recipe-add-edit-main-content">
        <div class="container my-2 page-main-content">
        <div class="card">
            <div class="card-body">
                <div th:switch="${recipes}" class="container my-2" th:with="convertToReadOnly=${ (#strings.equals('[ROLE_ADMIN]',(#authentication.getPrincipal().getAuthorities()))) ? ('false') : ((recipe!=null && recipe.id!=null ) ? ( ! #strings.equals(recipe.createdBy, (#authentication.getPrincipal().getUsername()) ) ) : 'false' ) }" >
	                <div class="row buttonsBar">
	                    
	                    <div class="nav-link">
	                        <a href="/recipes/recipe/list" class="btn btn-primary">
	                          <i class="fas fa-list-ul" th:text="#{button.action.recipe.listAll}">List of All Recipes</i>
	                        </a>
	                    </div>
	                    
						<div class="nav-link">
						    <a href="/recipes/recipe/new" class="btn btn-primary"><i
	       						class="fas fa-sync-alt"  th:text="#{button.action.refresh}"></i></a>
	                    </div>
						
	               </div>

	 			   <hr class="hrNoMargins"/>

                   <label th:text="AAAAAAAAA"></label>
                   convertToReadOnly=
                   <label th:text="${convertToReadOnly}"></label>
                   recipe.createdBy=
                   <label th:text="${recipe.createdBy}"></label>
                   loggedUser=
                   <label th:text="${(#authentication.getPrincipal().getUsername())}"></label>
				   auth=
                   <label th:text="${(#authentication.getPrincipal().getAuthorities())}"></label>

		           <br>
		           isPublic=                                            
                   <label th:text="${recipe.isPublic}"></label>

                    <div>
                      <div class="card">    
                          <div class="card-header">
                          	  <span th:text="( (${recipe.id==null}) ? #{label.recipe.newRecipe} : (  ( (${convertToReadOnly==true})  ? (#{label.recipe.viewRecipe} ) : (#{label.recipe.updateRecipe} ) ) + ' : [ ' + ${recipe.id} + ' ]' ) )"></span> 
						  </div>
					      <div class="card-body">
 
						  <form th:object="${recipe}" action="" class="form-horizontal" id="add-recipe-form" method="post">
                            <div class="row">
                            <div class="col-md-12 col-lg-6">
							    <div class="form-group has-feedback">
								  
								  <input type="hidden" th:field="*{id}" id="id">
								  <input type="hidden" th:field="*{createdBy}" id="createdBy">

							      <input
							        th:replace="~{fragments/inputField :: input (label='recipe.title', name='title', type='text', isReadOnly=(''+${convertToReadOnly}), classCustom='', readOnly='false', setTooltip='true')}" />
							      <!--   th:replace="~{fragments/inputField :: input ('recipe.title', 'title', 'text', 'dummy tooltip')}" />
							      -->

							      <input
							        th:replace="~{fragments/inputField :: input (label='recipe.dateOfCreation', name='dateOfCreation', type='date', isReadOnly=(''+${convertToReadOnly}), classCustom='', readOnly='false', setTooltip='')}" />

							      <input
							        th:replace="~{fragments/inputField :: input (label='recipe.timeOfCreation', name='timeOfCreation', type='time', isReadOnly=(''+${convertToReadOnly}), classCustom='', readOnly='false', setTooltip='')}" />

							      <input
							        th:replace="~{fragments/inputField :: input (label='recipe.dateTimeOfCreation', name='dateTimeOfCreation', type='dateTime', isReadOnly=(''+${convertToReadOnly}), classCustom='', readOnly='false', setTooltip='')}" />
							      
							      <input
							        th:replace="~{fragments/inputField :: input (label='recipe.url', name='url', type='text', isReadOnly=(''+${convertToReadOnly}), classCustom='', readOnly='false', setTooltip='')}" />

							    </div>
						    </div>
						    
                            <div class="col-md-12 col-lg-6">

							    <div class="form-group has-feedback">
							      <input
							        th:replace="~{fragments/selectField :: select (label='recipe.category', name='category', items=${categoryList}, isReadOnly=(''+${convertToReadOnly}))}" />
							    </div>

							    <div class="form-group has-feedback row rowStyle" >

		                              <div class="col-md-6 col-lg-6">
		                                <input
							           	  th:replace="~{fragments/inputField :: input (label='recipe.prepTime', name='prepTime', type='number', isReadOnly=(''+${convertToReadOnly}), classCustom='', readOnly='false', setTooltip='')}" />
									  </div>

		                              <div class="col-md-6 col-lg-6">
		                              	<input
							        	  th:replace="~{fragments/inputField :: input (label='recipe.cookTime', name='cookTime', type='number', isReadOnly=(''+${convertToReadOnly}), classCustom='', readOnly='false', setTooltip='')}" />
									  </div>

								</div>
								
															      
							    <input
							        th:replace="~{fragments/inputField :: input (label='recipe.source', name='source', type='text', isReadOnly=(''+${convertToReadOnly}), classCustom='', readOnly='false', setTooltip='')}" />
								
							    <div class="form-group has-feedback row rowStyle" >
		                            <div class="col-md-6 col-lg-6">
		                              	<div class="col-md-12 form-group">
		                                    <label th:text="#{label.recipe.difficulty}" class="labelPaddingTop">
		                                    </label>
	                                    	<select class="form-control" th:field="*{enumDifficulty}" th:disabled="${convertToReadOnly}">
	      										<option th:each="item:${T(rs.apps.nn.recipes.domain.EnumDifficulty).values()}"
	      											th:value="${item.name()}"
	      											th:text="(#{label.enum.difficulty.+${item.name()}})"> val
	      										</option>
	                                    	</select>
		                                    <select class="form-control" th:remove="all">
		                                        <option>Easy dummy</option>
		                                        <option>Medium dummy</option>
		                                        <option>Hard dummy</option>
		                                    </select>
		                                </div>
                                	</div>
                                	<div class="col-md-6 col-lg-6">
                                		<input
							        		th:replace="~{fragments/inputField :: input (label='recipe.portions', name='portions', type='number', isReadOnly=(''+${convertToReadOnly}), classCustom='', readOnly='false', setTooltip='')}" />
									</div>
								</div>
							    					      
							    <input
							        th:replace="~{fragments/inputField :: input (label='recipe.isPublic', name='isPublic', type='checkbox', isReadOnly=(''+${convertToReadOnly}), classCustom='', readOnly='false', setTooltip='')}" />
								
							
							</div>
						
        					<br>
        					<br>
        					<br>
        					
                            <div class="col-md-12 col-lg-12">
							    <div class="form-group has-feedback">
									<div class=" col-md-12 col-lg-12">
									  		<div class="card col-md-12 col-lg-12 zeroPadding">
									  		
										  		<h6 class="card-header text-white bg-light mb-3">
									        		<a class=" d-block " data-toggle="collapse" href="#ingredients-collapsed" aria-expanded="true" aria-controls="ingredients-collapsed" id="heading-ing-collapsed" >
									        		    <i class="fa fa-chevron-down pull-right"></i>
									            			<span th:text="#{label.recipe.dynRow.ingredients}"></span>
									        		</a>
									    		</h6>
										  		
								  				<!-- <div class="card-header"  th:text="#{label.recipe.dynRow.ingredients}">
								    				Ingredients:
								  				</div> -->
											    <div id = "ingredients-collapsed" class="collapse show card-body" aria-labelledby="heading-collapsed">
									  
													  <div>
													  
													  <div class="card card-default margin-bottom-20">

														  <table border="1" cellspacing="0" id="tableDynRows" name="tableDynRows" class="table table-bordered table-hover table-sm margin-bottom-zero">
															  <thead class="thead-light" >
														        <tr>
														            <th></th>
														            <th th:text="#{label.recipe.dynRow.rowNum}" class="innerTableTh">Row Number</th>
														            <th th:text="#{label.recipe.dynRow.quantity}" class="innerTableTh">Quantity</th>
														            <th th:text="#{label.recipe.dynRow.measure}" class="innerTableTh">Measure</th>
														            <th th:text="#{label.recipe.dynRow.ingredient}" class="innerTableTh">Ingredient</th>
														        <!--    <th th:text="#{label.recipe.dynRow.checked}" class="innerTableTh">Checked</th>  -->
														        </tr>
														      </thead>
														      <tbody>
															    <tr th:each="row,rowStat : *{ingredients}">

																  <td>
																    <input type='checkbox' th:disabled="${convertToReadOnly ? 'disabled' : 'false'}"  class='case'/>
															        <input type="hidden" th:field="*{ingredients[__${rowStat.index}__].id}" />
															        <input type="hidden" th:field="*{ingredients[__${rowStat.index}__].recipe.id}" />
															        <!-- <input type="hidden" th:field="*{ingredients[__${rowStat.index}__].recipeFk}" /> -->
															      </td>
															      
															      <td  class='row_no' th:text="(${rowStat.count}+'.')">1</td>

															      <td>
															        <input type="text" th:readonly="${convertToReadOnly ? 'readonly' : 'false'}" size='3' class=" aaa text-field-dynamicrow form-control" th:field="*{ingredients[__${rowStat.index}__].amount}" />
															      </td>

															      <td>
															        <select  th:disabled="${convertToReadOnly ? 'disabled' : 'false'}" class="form-control-sm col-12 col-md-12 form-control" th:field="*{ingredients[__${rowStat.index}__].uom}">
															          <option th:each="var : ${allUnitOfMeasuresList}" 
															                  th:value="${var.id}" 
															                  th:text="(#{label.enum.unitOfMeasure.+${var.description}})"
															                  >Cup</option>
															        </select>
															      </td>

															      <td>
															        <input type="text" th:readonly="${convertToReadOnly ? 'readonly' : 'false'}" class="text-field-dynamicrow form-control" th:field="*{ingredients[__${rowStat.index}__].ingredientName}" />
															      </td>

															    </tr>
															  </tbody>
													      </table>
													  </div>
													      
													  </div>
												      <div  th:if="${!convertToReadOnly}"  class="btn-container">
												        <button type="button" class='btn addmore btn-outline-info'  th:text="#{button.action.addMoreRows}">+ Add More</button>
												        <button type="button" class='btn delete btn-outline-danger'  th:text="#{button.action.deleterows}" >- Delete</button>
												      </div>
									  
									  			</div>
									  		</div>
								    </div>
								</div>
						    </div>
        					
        					<br>
        					<br>
        					<br>
        					
                            <div class="col-md-12 col-lg-12">
							    <div class="form-group has-feedback">
							      <input
							        th:replace="~{fragments/inputField :: input (label='recipe.instructions', name='description', type='textarea', isReadOnly=(''+${convertToReadOnly}))}" />
							    
							    </div>
						    </div>

        					<br>


							
                            <div class="col-md-12 col-lg-12">
							    <div class="form-group has-feedback">
									<div class="col-md-12 col-lg-12">
									  		<div class="card col-md-12 col-lg-12 zeroPadding">
								  				<div class="card-header"  th:text="#{label.recipe.tags}">
								    				Tags:
								  				</div>
											    <div class="card-body">
											    	<select th:disabled="${convertToReadOnly ? 'disabled' : 'false'}" class="form-select" id="recipesTags" name="recipesTags" multiple data-allow-clear="true" data-clear-label="Clear" data-allow-new="true">
														<option selected disabled hidden value="">Choose a tag...</option>
													    <option selected="selected" th:each="prod,iterStat : ${recipe.tags}" 
										                  th:value="(${prod.id}+':'+${prod.value})" 
										                  th:text="(${iterStat.count}+' ['+${prod.id}+'] : '+${prod.value})"
										                  >Cup
			  								            </option>
													</select>

												</div>
												<div>
												
												</div>
									  		</div>
								    </div>
								</div>
						    </div>
        					
        					<br>
        					<br>
							<br>
        					
						    </div>
						    <div class="form-group">
						      <div th:if="${!convertToReadOnly}" class="col-sm-offset-2 col-sm-10">
						        <button class="btn btn-primary" type="submit">
						            <i class="fas fa-save" th:with="text=${recipe['new']} ? 'save' : 'update'" th:text="(#{button.action.+${text}})">  </i>
						        </button>
						      </div>
						    </div>
						    
						    <hr>
						  </form>


							<div class="col-md-12 col-lg-12">
								<div class="form-group has-feedback">

									<div class="card">

										<h6 class="card-header text-white bg-light mb-3">
							        		<a class=" d-block " data-toggle="collapse" href="#collapse-collapsed" aria-expanded="true" aria-controls="collapse-collapsed" id="heading-collapsed" >
							        		    <i class="fa fa-chevron-down pull-right"></i>
							            			<span th:text="#{label.recipe.imageInfo}"></span>
							        		</a>
							    		</h6>

									    <div id="collapse-collapsed" class="collapse show" aria-labelledby="heading-collapsed">
									        <div class="card-body" style="padding-top:0">
								    			  <div class="col-md-12 col-lg-12 row zeroMargin" style="font-style: oblique;" >
			                                	  		<div th:if="${!convertToReadOnly}" class="col-md-4 col-lg-4 zeroPadding" >
							 								  <div>
																	<form method="POST" enctype="multipart/form-data" th:action="@{${recipe.id}+'/uploadPhoto'}" >
																		<table>
																			<tr>
																				<td><span th:text="#{label.files.uploadNewFile}"></span></td>
																			</tr>
																			<tr>
																				<td><input type="file" name="file" class="btn btn-primary" /></td>
																			</tr>
																			<tr>
																				<td>
																				<input type="submit" value="Upload" id="uploadBtn" class="btn btn-outline-primary" >
																				</td>
																			</tr>
																		</table>
																		
																    	<input type="hidden" id="newPhotoRecipeId" name="newPhotoRecipeId" th:value="${recipe.id}">
																    	<input type="hidden" id="imageId" name="imageId" th:value="${recipeImage?.id}">
																		
																	</form>
															  </div>
			                                			</div>
			                                						                                			
			                                			<div th:class="${(convertToReadOnly==true) ? ('col-md-12 col-lg-12 zeroPadding'):('col-md-8 col-lg-8 zeroPadding')}" >
															<div th:switch="${recipeImagesByOwner==null || recipeImagesByOwner.size()==0}" class="container my-2">
	                    				    						<div th:case="true">
																		<img th:if="${!convertToReadOnly}" class="rounded mx-auto d-block" height="250" src="/recipes/img/placehldrImg.png">
																	    <h2 th:if="${convertToReadOnly}" style="text-align:center" th:text="#{label.images.list.noImagesYet}"></h2>
																	</div>
	                        										<div th:case="false">
																		<div id="carouselRecipeImageByOwner" style="border:1px solid #ccc" class="carousel slide" data-ride="carousel">
	
																		  <ol class="carousel-indicators" >
																		    <li th:each="img, imgStat:${recipeImagesByOwner}" data-target="#carouselRecipeImageByOwner" th:attr="data-slide-to=${imgStat.index}" th:class="${imgStat.index}==0 ? 'active':''"></li>
																		  </ol>
	
																		  <div class="carousel-inner">
																			    <div th:class="${imgStat.index}== 0  ? 'carousel-item active':'carousel-item'" th:each="img, imgStat:${recipeImagesByOwner}">
																			      <!-- <img th:src="@{'/recipeImage/image/' + ${img.fileData.id}}" height="350" style="object-fit: contain;" class="d-block w-100" alt="..."/>
						  														   -->
						  														  <img th:src="${img.url}"  height="450"  style="object-fit: contain;" class="d-block w-100" alt="...">																			      
																			    </div>
																		  </div>
																		  
																		  <a class="carousel-control-prev" href="#carouselRecipeImageByOwner" role="button" data-slide="prev" >
																		    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
																		    <span class="sr-only">Previous</span>
																		  </a>
																		  <a class="carousel-control-next" href="#carouselRecipeImageByOwner" role="button" data-slide="next" >
																		    <span class="carousel-control-next-icon" aria-hidden="true"></span>
																		    <span class="sr-only">Next</span>
																		  </a>
																		</div>
															     	</div>
															</div>
			                                			</div>
			                                	  </div>
								    			  
											</div>
										</div>
									</div>
								
								</div>
							</div>



							<div class="col-md-12 col-lg-12">
								<div class="form-group has-feedback">
									<div class="card col-md-12 col-lg-12 zeroPadding">
										<!-- <div class="card-header" th:text="#{label.recipe.addInfo}">Additional:</div>
										 -->
										<h6 class="card-header text-white bg-light mb-3">
							        		<a class=" d-block " data-toggle="collapse" href="#add-info-collapsed" aria-expanded="true" aria-controls="add-info-collapsed" id="heading-collapsed" >
							        		    <i class="fa fa-chevron-down pull-right"></i>
							            			<span th:text="#{label.recipe.addInfo}"></span>
							        		</a>
							    		</h6>
										
										<div id="add-info-collapsed" class="card-body collapse show">
											<div>
												<div>
												  <!-- Nav tabs -->
												  <ul class="nav nav-tabs mt-2" role="tablist">
												    <li role="presentation" class="nav-item active"> <a href="#comments" class="nav-link active" aria-controls="home" role="tab" data-toggle="tab" th:text="#{label.recipe.commentsData}">Comments</a></li>
												    <li role="presentation" class="nav-item" > <a href="#images" class="nav-link" aria-controls="profile" role="tab" data-toggle="tab" th:text="#{label.recipe.galleryUsers}">Images</a></li>
												    <!-- 
												    <li role="presentation" class="nav-item" ><a href="#addAdvices" class="nav-link" aria-controls="messages" role="tab" data-toggle="tab" th:text="#{label.recipe.addTips}">Additional tips</a></li>
 													-->
												  </ul>
												  
												  <!-- Tab panes -->
												  <div class="tab-content tabsContent">												  
												    <br/>

												    <div role="tabpanel" class="tab-pane fade show active" id="comments" aria-labelledby="home-tab">
												   		<div id="commentDataAJAX" >
													    	<input type="hidden" id="newCommentRecipeId" name="newCommentRecipeId" th:value="${recipe.id}">
														</div>
												    </div>

												    <div role="tabpanel" class="tab-pane fade" id="images">
												   		<div  th:if="${!convertToReadOnly}"  class="col-md-12 col-lg-12">
															<div class="form-group has-feedback">
																<div  class="card">
																	<h6 class="card-header text-white bg-light mb-3">
														        		<a class=" d-block collapsed" data-toggle="collapse" href="#comm-collapse-collapsed" aria-expanded="false" aria-controls="comm-collapse-collapsed" id="heading-collapsed" >
														        		    <i class="fa fa-chevron-down pull-right"></i>
														            			<span th:text="#{label.recipe.comments.addNewPhoto}"></span>
														        		</a>
														    		</h6>
																	<!-- <div class="card-header" th:text="#{label.recipe.imageInfo}">Recipe photo:</div>-->
																    <div id="comm-collapse-collapsed" class="collapse" aria-labelledby="heading-collapsed">
																        <div class="card-body" style="padding-top:0">
															    			  <div class="col-md-12 col-lg-12 row zeroMargin" style="font-style: oblique;" >
												                            	  <div>
																					<form method="POST" enctype="multipart/form-data" th:action="@{${recipe.id}+'/uploadCommentsPhoto'}" >
																						<table>
																							<tr>
																								<td><span th:text="#{label.files.uploadNewFile}"></span></td>
																								<td><input type="file" name="file" class="btn btn-primary" />
																								</td>
																							</tr>
																							<tr>
																								<td></td>
																								<td><input type="submit" value="Upload" id="uploadBtn" class="btn btn-outline-primary" >
																								</td>
																							</tr>
																						</table>
																				    	<input type="hidden" id="newCommentPhotoRecipeId" name="newCommentPhotoRecipeId" th:value="${recipe.id}">
																					</form>
																				  </div>
														                      </div>		  
																		</div>
																	</div>
																</div>

		function onAddCheckboxRefresh(){
			$('input[type=checkbox]').on("change",function(){
			    // alert('aaa');
			    var target = $(this).parent().find('input[type=hidden]').val();
			    // alert('target:'+target);
			    if(target == 0)
			    {
			        target = 1;
			    }
			    else
			    {
			        target = 0;
			    }
			    $(this).parent().find('input[type=hidden]').val(target);
			});
		}

				  $.ajax({
